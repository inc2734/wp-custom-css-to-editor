name: CI
on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches:
    - '**'
    tags:
    - "!*"
    paths-ignore:
    - '**.md'

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    - name: Npm install
      run: npm install

    - name: Running the tests
      run: npm run test
